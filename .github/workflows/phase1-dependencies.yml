name: Phase 1 dependency bootstrap

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install locked scaffold
        run: npm ci

      - name: Install Phase 1 runtime dependencies
        run: |
          npx expo install expo-secure-store expo-dev-client @sentry/react-native

      - name: Install Phase 1 test and lint dependencies
        run: |
          npx expo install jest-expo jest @types/jest @testing-library/react-native eslint eslint-config-expo --dev

      - name: Validate Expo dependency compatibility
        run: npx expo install --check

      - name: Record dependency graph
        run: |
          set -euo pipefail
          rm -f .github/workflows/phase1-dependencies.yml
          rm -f .bootstrap-trigger .phase1-deps-trigger
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: add phase 1 production dependencies"
          git push origin HEAD:main
