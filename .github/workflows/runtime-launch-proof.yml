name: Runtime launch proof

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-simulator-launch:
    name: iOS simulator launch
    runs-on: macos-26
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install
        run: npm ci

      - name: Record Apple toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
          node --version
          npm --version

      - name: Build, install, and launch on iOS Simulator
        run: bash scripts/ci/ios-launch-proof.sh

      - name: Upload iOS launch evidence
        if: always()
        uses: actions/upload-artifact@615b319bd27bb32c3d64dca6b6ed6974d5fbe653 # v6.0.0
        with:
          name: ios-launch-evidence
          path: artifacts/ios-launch.png
          if-no-files-found: warn

  android-emulator-launch:
    name: Android emulator launch
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.21.0
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@536de9e5ba95309550b74c08e297b4b0f11e8b7d # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install
        run: npm ci

      - name: Create and boot Android emulator
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          EMULATOR="$ANDROID_HOME/emulator/emulator"

          test -x "$SDKMANAGER"
          test -x "$AVDMANAGER"
          test -x "$EMULATOR"

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "emulator" "system-images;android-36;google_apis;x86_64"
          echo "no" | "$AVDMANAGER" create avd \
            --force \
            --name rn-starter-api36 \
            --package "system-images;android-36;google_apis;x86_64" \
            --device "pixel_6"

          nohup "$EMULATOR" \
            -avd rn-starter-api36 \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            > "$RUNNER_TEMP/android-emulator.log" 2>&1 &

          adb wait-for-device

          for _ in {1..120}; do
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
              break
            fi
            sleep 5
          done

          if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" != "1" ]]; then
            cat "$RUNNER_TEMP/android-emulator.log"
            exit 1
          fi

          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

      - name: Build, install, and launch on Android Emulator
        run: bash scripts/ci/android-launch-proof.sh

      - name: Upload Android launch evidence
        if: always()
        uses: actions/upload-artifact@615b319bd27bb32c3d64dca6b6ed6974d5fbe653 # v6.0.0
        with:
          name: android-launch-evidence
          path: |
            artifacts/android-launch.png
            artifacts/android-window.xml
          if-no-files-found: warn
